name: Build Windows & macOS

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install PyTorch (CPU)
      shell: bash
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Build EXE with PyInstaller
      shell: bash
      run: |
        pyinstaller --name "BallonsTranslator" --onedir --windowed --noconfirm --clean --add-data "resources;resources" --add-data "config;config" --add-data "data;data" --hidden-import ballontranslator --hidden-import ballontranslator.modules --hidden-import ballontranslator.ui --hidden-import ballontranslator.utils --collect-submodules ballontranslator ballontranslator/__main__.py

    - name: Copy extra files
      shell: bash
      run: |
        cp -r fonts dist/BallonsTranslator/fonts
        cp -r doc dist/BallonsTranslator/doc
        cp launch_win.bat dist/BallonsTranslator/
        cp README.md dist/BallonsTranslator/

    - name: Create ZIP archive
      shell: bash
      run: |
        cd dist && 7z a BallonsTranslator_win.zip BallonsTranslator/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BallonsTranslator-windows
        path: dist/BallonsTranslator_win.zip
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install PyTorch (CPU)
      shell: bash
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Build APP with PyInstaller
      shell: bash
      run: |
        pyinstaller --name "BallonsTranslator" --onedir --windowed --noconfirm --clean --add-data "resources:resources" --add-data "config:config" --add-data "data:data" --hidden-import ballontranslator --hidden-import ballontranslator.modules --hidden-import ballontranslator.ui --hidden-import ballontranslator.utils --collect-submodules ballontranslator ballontranslator/__main__.py

    - name: Copy extra files
      shell: bash
      run: |
        cp -r fonts dist/BallonsTranslator/fonts
        cp -r doc dist/BallonsTranslator/doc
        cp README.md dist/BallonsTranslator/

    - name: Create ZIP archive
      shell: bash
      run: |
        cd dist && zip -r BallonsTranslator_mac.zip BallonsTranslator/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BallonsTranslator-macos
        path: dist/BallonsTranslator_mac.zip
        retention-days: 30
