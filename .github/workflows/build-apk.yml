name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
      - 'ver*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Manga-Translator.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "Manga-Translator-${{ github.ref_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manga-Translator-APK
          path: |
            Manga-Translator.apk
            Manga-Translator-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Manga-Translator.apk
            Manga-Translator-${{ github.ref_name }}.apk
          name: 🚀 Manga Translator ${{ github.ref_name }} (Android APK)
          body: |
            # 🎨 Manga Translator - Phiên bản ${{ github.ref_name }}

            Chào mừng bạn đến với phiên bản chính thức **Manga Translator ${{ github.ref_name }}** dành cho thiết bị Android & Web!

            [![Android APK](https://img.shields.io/badge/Download-Manga_Translator_APK-3DDC84?style=for-the-badge&logo=android&logoColor=white)](#download)
            [![Capacitor](https://img.shields.io/badge/Capacitor-v8.5-119EFF?style=for-the-badge&logo=capacitor&logoColor=white)](#)
            [![License MIT](https://img.shields.io/badge/License-MIT-green?style=for-the-badge)](#)

            ---

            ### 🌟 Tính Năng Mới Trên Phiên Bản ${{ github.ref_name }}

            - 📁 **Chọn Cả Thư Mục Ảnh Đầu Vào (Input Folder Picker)**:
              - Cho phép chọn toàn bộ thư mục chapter manga cùng lúc trên điện thoại & máy tính.
              - **Tự động sắp xếp thứ tự trang tự nhiên (Natural Numerical Sort)**: `1.jpg, 2.jpg, ... 10.jpg` đúng chuẩn đọc truyện.
            - 💾 **Tùy Chọn & Cài Đặt Thư Mục Lưu Kết Quả (Output Folder)**:
              - Lưu trực tiếp kết quả vào bộ nhớ máy Android tại `Documents/MangaTranslator/[Chapter]`.
              - Không bị popup hỏi lưu từng file khi chạy hàng loạt.
            - 📦 **Đóng Gói Trọn Gói Thư Mục (.ZIP)**:
              - Tải về toàn bộ các trang đã dịch dưới dạng 1 file nén `.ZIP` duy nhất với 1 chạm.
            - 📱 **Đóng gói Native Android (.apk)**:
              - Tên ứng dụng hiển thị trên màn hình: **Manga Translator**.
              - Đầy đủ tính năng Offline-first với IndexedDB Storage và bộ font tiếng Việt 100%.
            - 🤖 **Bộ đôi AI Đỉnh Cao**:
              - Mô hình xóa chữ nền **LaMa (Large Mask Inpainting)** siêu sạch.
              - Nhận diện chữ **Manga-OCR** offline không kiểm duyệt & **Gemini AI Vision** hiểu ngữ cảnh.

            ---

            ### 📲 Hướng Dẫn Cài Đặt File APK

            1. Cuộn xuống phần **Assets** bên dưới và nhấn tải file **`Manga-Translator.apk`** hoặc **`Manga-Translator-${{ github.ref_name }}.apk`**.
            2. Mở file `.apk` đã tải trên điện thoại Android của bạn.
            3. Nếu thiết bị hỏi quyền cài đặt từ nguồn ngoài, hãy chọn **Cho phép (Allow)**.
            4. Nhấn **Cài đặt (Install)** và trải nghiệm dịch truyện không giới hạn!

            ---
            *📌 Được tự động đóng gói & xuất bản bởi **GitHub Actions & Capacitor CLI**.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

