name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
      - 'ver*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MangaStudio-v0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-APK
          path: MangaStudio-v0.1.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MangaStudio-v0.1.apk
          name: 🚀 Manga Studio AI ${{ github.ref_name }} (Android APK)
          body: |
            # 🎨 Manga Studio AI - Phiên bản ${{ github.ref_name }}

            Chào mừng bạn đến với phiên bản chính thức **Manga Studio AI ${{ github.ref_name }}** dành cho thiết bị Android & Web!

            [![Android APK](https://img.shields.io/badge/Download-Android_APK-3DDC84?style=for-the-badge&logo=android&logoColor=white)](#download)
            [![Capacitor](https://img.shields.io/badge/Capacitor-v7.0-119EFF?style=for-the-badge&logo=capacitor&logoColor=white)](#)
            [![License MIT](https://img.shields.io/badge/License-MIT-green?style=for-the-badge)](#)

            ---

            ### 🌟 Tính Năng Nổi Bật Bản Release

            - 📱 **Đóng gói Native Android (.apk)**: Tích hợp Capacitor SDK 7+, khởi chạy mượt mà như ứng dụng gốc trên smartphone và tablet Android.
            - 🎯 **Giao diện Tối ưu Di Động (Mobile-First UI)**:
              - **Drawer điều khiển thông minh**: Hỗ trợ vuốt mở/đóng danh sách ảnh và bảng tùy chỉnh ô thoại.
              - **Touch Gestures & Wheel Zoom**: Phóng to, thu nhỏ, di chuyển ảnh mượt mà bằng cử chỉ chạm hoặc con trỏ.
            - 🔤 **Bộ Font chữ Manga chuẩn 100% Việt Hóa**: Hỗ trợ đầy đủ tiếng Việt có dấu với các phông chữ comic như *Be Vietnam Pro, Mali, Comfortaa, Itim, Pangolin, Nunito...*
            - 🤖 **Kết nối Colab AI Backend**:
              - Mô hình xóa chữ **LaMa (Large Mask Inpainting)** siêu sạch.
              - Nhận diện chữ **Manga-OCR** offline chống censorship.
              - Dịch ngữ cảnh thông minh bằng **Gemini AI Vision**.

            ---

            ### 📲 Hướng Dẫn Cài Đặt File APK

            1. Cuộn xuống phần **Assets** bên dưới và ấn vào **`MangaStudio-v0.1.apk`** để tải về.
            2. Mở file `.apk` đã tải trên điện thoại Android của bạn.
            3. Nếu thiết bị hỏi quyền cài đặt từ nguồn ngoài, hãy chọn **Cho phép (Allow)**.
            4. Nhấn **Cài đặt (Install)** và trải nghiệm ứng dụng!

            ---
            *📌 Được tự động đóng gói & xuất bản bởi **GitHub Actions & Capacitor CLI**.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
