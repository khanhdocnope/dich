name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
      - 'ver*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MangaStudio-v0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-APK
          path: MangaStudio-v0.1.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MangaStudio-v0.1.apk
          name: Manga Studio AI ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}
            
            - Tự động đóng gói APK bằng Capacitor & GitHub Actions.
            - Hỗ trợ giao diện di động tối ưu, gesture kéo thả và drawer điều khiển.
            - Tích hợp hệ thống Manga Translator Studio (Colab AI Backend).
            
            ### Hướng dẫn cài đặt
            Tải file `MangaStudio-v0.1.apk` bên dưới và cài đặt trực tiếp trên thiết bị Android.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
