name: Build Android APK & Windows EXE Release

on:
  push:
    tags:
      - 'v*'
      - 'ver*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Manga-Translator.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "Manga-Translator-${{ github.ref_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            Manga-Translator.apk
            Manga-Translator-${{ github.ref_name }}.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Build Windows Executables
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Executables
        shell: pwsh
        run: |
          $setupExe = Get-Item release/*Setup*.exe | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "Manga-Translator-Studio-Setup-${{ github.ref_name }}.exe"
          }
          $portableExe = Get-Item release/*.exe | Where-Object { $_.Name -notmatch "Setup" } | Select-Object -First 1
          if ($portableExe) {
            Copy-Item $portableExe.FullName "Manga-Translator-Studio-Portable-${{ github.ref_name }}.exe"
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-exe
          path: |
            Manga-Translator-Studio-Setup-${{ github.ref_name }}.exe
            Manga-Translator-Studio-Portable-${{ github.ref_name }}.exe

  create-release:
    name: Publish Multiplatform Release
    needs: [build-apk, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Manga-Translator.apk
            Manga-Translator-${{ github.ref_name }}.apk
            Manga-Translator-Studio-Setup-${{ github.ref_name }}.exe
            Manga-Translator-Studio-Portable-${{ github.ref_name }}.exe
          name: 🚀 Manga Translator Studio ${{ github.ref_name }} (APK & Windows)
          body: |
            # 🎨 Manga Translator Studio - Phiên bản ${{ github.ref_name }}

            Chào mừng bạn đến với phiên bản chính thức **Manga Translator Studio ${{ github.ref_name }}** hỗ trợ cả thiết bị **Android** và **Windows PC**!

            [![Android APK](https://img.shields.io/badge/Download-Android_APK-3DDC84?style=for-the-badge&logo=android&logoColor=white)](#download)
            [![Windows EXE](https://img.shields.io/badge/Download-Windows_EXE-0078D6?style=for-the-badge&logo=windows&logoColor=white)](#download)
            [![License MIT](https://img.shields.io/badge/License-MIT-green?style=for-the-badge)](#)

            ---

            ### 🌟 Điểm Mới Trên Phiên Bản ${{ github.ref_name }}

            - 💻 **Bản Cài Đặt & Chạy Trực Tiếp Cho Windows (.EXE)**:
              - File **Setup Installer**: Cài đặt vào máy tính, tự tạo icon Desktop & Start Menu.
              - File **Portable**: Chạy trực tiếp siêu tiện lợi không cần cài đặt.
            - 🇻🇳 **Ngôn Ngữ Giao Diện Chuẩn Studio**:
              - Tùy chọn chuyển đổi tức thì giữa **Tiếng Việt** và **English**.
              - Việt hóa toàn diện thanh công cụ, bảng thuộc tính, thư viện trang và menu điều hướng.
            - 📐 **Thiết Kế Serene Bento Obsidian Dark**:
              - Sửa lỗi thanh lọc trang (không còn bị tràn viền nút *Đã Xong*).
              - Sắp xếp thông tin thẻ trang khoa học, tên file hiển thị trọn vẹn.
              - Thanh công cụ vẽ/xóa trên điện thoại đưa lên đầu màn hình, tránh bị che bởi thanh điều hướng ngón tay cái.
            - 🧹 **Cọ Vẽ Inpaint Chuẩn Xác**:
              - Chỉ tập trung xóa chữ trên ảnh gốc với mô hình LaMa, tuyệt đối không tự chèn thêm bounding box thừa.
            - ⚡ **Kết Nối AI Thuận Tiện**:
              - Truy cập cài đặt Google Colab URL & Gemini API Key nhanh chóng qua 3 vị trí trên giao diện.

            ---

            ### 📲 Hướng Dẫn Tải & Cài Đặt

            #### 💻 Dành cho Windows:
            1. Tải **`Manga-Translator-Studio-Setup-${{ github.ref_name }}.exe`** (bản cài đặt) hoặc **`Manga-Translator-Studio-Portable-${{ github.ref_name }}.exe`** (chạy ngay).
            2. Mở file `.exe` để bắt đầu sử dụng ngay lập tức trên máy tính.

            #### 📱 Dành cho Android:
            1. Tải file **`Manga-Translator.apk`** hoặc **`Manga-Translator-${{ github.ref_name }}.apk`**.
            2. Mở file `.apk` trên điện thoại Android và chọn **Cài đặt**.

            ---
            *📌 Được tự động đóng gói & xuất bản bởi **GitHub Actions, Capacitor CLI & Electron Builder**.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
